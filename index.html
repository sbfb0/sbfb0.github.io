<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBFB | The Unified Web Language</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f0f13; color: #fff; line-height: 1.6; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .logo { font-size: 24px; font-weight: bold; color: #4CAF50; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: #ccc; text-decoration: none; transition: 0.3s; }
        .nav-links a:hover { color: #4CAF50; }
        .btn { padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-outline { background: transparent; border: 1px solid #4CAF50; color: #4CAF50; }
        .hero { text-align: center; padding: 80px 20px; background: radial-gradient(circle at center, #1a2a1a 0%, #0f0f13 70%); }
        .hero h1 { font-size: 56px; margin-bottom: 20px; }
        .hero span { color: #4CAF50; }
        .section-container { padding: 60px 50px; max-width: 1200px; margin: 0 auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .project-card { background: #1e1e24; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .project-card:hover { transform: translateY(-5px); border-color: #00d2ff; }
        .project-img { width: 100%; height: 150px; background: #2a2a32; display: flex; justify-content: center; align-items: center; font-size: 50px; }
        .project-info { padding: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">⚡ SBFB</a>
        <div class="nav-links">
            <a href="/docs/">Docs</a>
            <a href="/block-code/">Block Studio</a>
            <a href="/type-code/">Type Studio</a>
        </div>
    </nav>

    <section class="hero">
        <h1>SBFB <span>Hub</span></h1>
        <p>The first unified language for Frontend, Backend, and AI Agents.</p>
        <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
            <a href="/type-code/" class="btn btn-primary">Open Studio</a>
            <a href="/docs/" class="btn btn-outline">Read Docs</a>
        </div>
    </section>

    <div class="section-container">
        <h2 style="margin-bottom: 30px;">Featured Projects</h2>
        <div class="gallery-grid">
            <div class="project-card">
                <div class="project-img">🏎️</div>
                <div class="project-info">
                    <h3>SBFB Turbo</h3>
                    <p style="color:#aaa; font-size:14px; margin-bottom:15px;">A retro racing game.</p>
                    <a href="/type-code/?code=start%3ASBFB%0Afrontend%0Atype(%22Loading%20Turbo...%22)%0Ainsert%20html%20(g.html)%0A%3Ch1%3ERacing%20Game%3C%2Fh1%3E%0Aend%3Ainsert%0A%3Cend%3A-SBFB%3E" class="btn btn-primary" style="width:100%;">Launch Game</a>
                </div>
            </div>
            
            <div class="project-card">
                <div class="project-img">🤖</div>
                <div class="project-info">
                    <h3>Isaahi AI</h3>
                    <p style="color:#aaa; font-size:14px; margin-bottom:15px;">Smart AI Agent interface.</p>
                    <a href="/type-code/?code=start%3ASBFB%0Ainsert%3Atool%20brain%20ai%0A%7B%0Ayou%20are%20a%20helpful%20AI.%0A%7D%0A%3Cend%3ASBFB%3E" class="btn btn-primary" style="width:100%;">Talk to AI</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
